<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Images Project</title>

  <style>
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <h1>Responsive Images Example</h1>

  <picture>
    <source srcset="assets/img/image.avif" type="image/avif">
    <source srcset="assets/img/image.webp" type="image/webp">

    <img 
      src="assets/img/image.jpg" 
      alt="Forest image"
      loading="lazy"
      decoding="async">
  </picture>
</body>
</html>
